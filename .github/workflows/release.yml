name: Release

# Al subir una etiqueta (p. ej. 1.3.0) compila el APK firmado y lo publica en GitHub Releases.
# La app SG Alfa del teléfono descarga siempre: releases/latest/download/sg-alfa-home.apk
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Firma (clave estable para poder actualizar sin desinstalar)
        env:
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
        run: |
          test -n "${SIGNING_JKS_FILE_BASE64:-}" || { echo "Falta el secreto SIGNING_JKS_FILE_BASE64"; exit 1; }
          echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
      - name: Versión
        id: meta
        run: |
          BUILD_NUMBER=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "build_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=$(sed -nE 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - name: Compilar APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=${{ steps.meta.outputs.build_number }} \
            --build-name=${{ steps.meta.outputs.build_name }}
          mkdir -p dist
          APK=$(find build/app/outputs -name 'arc-launcher-universal-release.apk' | head -1)
          test -n "$APK" || { find build/app/outputs -name '*.apk'; exit 1; }
          cp "$APK" "dist/sg-alfa-home-${{ steps.meta.outputs.build_name }}.apk"
          cp "$APK" dist/sg-alfa-home.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sg-alfa-home
          path: dist/
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ github.ref_name }}
          name: SG Alfa Home ${{ github.ref_name }}
          body: |
            SG Alfa Home ${{ github.ref_name }} (basado en Arc Launcher, GPL-3.0).
            - Protección SG Alfa: bloqueo de anuncios y pop-ups por DNS, automatizaciones estilo MacroDroid.
            Instálalo desde la app SG Alfa del teléfono o con Downloader:
            https://github.com/SantiagoGarces96/sg-alfa-home/releases/latest/download/sg-alfa-home.apk
          files: dist/*
          fail_on_unmatched_files: true
